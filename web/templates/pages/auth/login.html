{{define "content"}} {{with .LoginForm}}
<div class="page-header">
  <h1>{{.Judul}}</h1>
</div>

{{with index .Errors "Error"}}
<div class="form-errors">{{.}}</div>
{{end}}

<form method="post" action="{{.Action}}" class="form">
  <div class="field">
    <label for="email">Email</label>
    <input
      id="email"
      name="email"
      type="email"
      value="{{.Data.Email}}"
      placeholder="San@email.com"
      autocomplete="off"
    />
    {{with index .Errors "Email"}}
    <div class="form-errors">{{.}}</div>
    {{end}}
  </div>


  <div class="field">
    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      value="{{.Data.Password}}"
      autocomplete="off"
    />
    {{with index .Errors "Password"}}
    <div class="form-errors">{{.}}</div>
    {{end}}
  </div>


  <div class="form-actions">
    <button type="submit" class="button">Login</button>
    <a href="/ingredients" class="button button--secondary">Batal</a>
  </div>
</form>

{{end}}{{end}}
