{{define "content"}}
<div class="page-header">
  <h1>Bahan Baku</h1>
  <a href="/ingredients/create" class="button">Tambah Bahan</a>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Nama</th>
        <th>Satuan Dasar</th>
        <th>Satuan Beli</th>
        <th class="num">Isi per Satuan Beli</th>
        <th><span class="sr-only">Aksi</span></th>
      </tr>
    </thead>
    <tbody>
      {{range .ingredients}}
      <tr>
        <td><strong>{{.Name}}</strong></td>
        <td><span class="badge">{{.BaseUnit}}</span></td>
        <td>{{.PurchaseUnit}}</td>
        <td class="num">{{.BaseQtyPerPurchaseUnit}} {{.BaseUnit}}</td>
        <td>
          <div class="actions">
            <a
              href="/ingredients/{{.ID}}/prices"
              class="button button--secondary button--sm"
              >Harga</a
            >
            <a
              href="/ingredients/{{.ID}}/edit"
              class="button button--secondary button--sm"
              >Ubah</a
            >
            <form
              method="post"
              action="/ingredients/{{.ID}}/delete"
              onsubmit="return confirm('Hapus bahan ini?');"
            >
              <button type="submit" class="button button--danger button--sm">
                Hapus
              </button>
            </form>
          </div>
        </td>
      </tr>
      {{else}}
      <tr>
        <td colspan="5" class="empty">Belum ada bahan baku.</td>
      </tr>
      {{end}}
    </tbody>
  </table>
</div>
{{end}}
