{{define "layout"}}
<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.title}}</title>
    <link rel="stylesheet" href="/web/static/styles.css" />
  </head>
  <body>
    {{if .IsAuthPage}}
      <main class="auth-content">
        {{template "content" .}}
      </main>
    {{else}}
      <div class="layout">
        {{template "sidebar" .}}
        <div class="main">
          <main class="content">{{template "content" .}}</main>
        </div>
      </div>
    {{end}}
  </body>
</html>
{{end}}
